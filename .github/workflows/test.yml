name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: Run unit tests
        run: deno task test --frozen
      - name: Type check gateway
        run: deno task check --frozen
      - name: Verify disk cache and publisher isolation
        run: |
          deno task test:verified-cache --frozen
          deno task test:blob-cache --frozen
      - name: Verify real loopback HTTP fills
        run: deno task test:verified-network --frozen
